services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_monetization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/api_monetization
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-in-production}
      NODE_ENV: production
      FRONTEND_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - server

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - '5174:80'
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
